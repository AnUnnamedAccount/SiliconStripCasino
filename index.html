<title>Silicon Strip Casino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: marquee header strip; the live casino floor canvas fills the left; a ledger panel sits right and stacks under the floor on phones */
:root{
  --carpet:#24101b;
  --panel:#1a0d15;
  --panel-2:#26141f;
  --line:#3e2533;
  --ink:#f4eadc;
  --muted:#b9a4ae;
  --brass:#dcb05a;
  --win:#74d6a0;
  --loss:#f08572;
  --chat:#a9c8ff;
  --display:'Limelight', 'Didot', Georgia, serif;
  --body:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --label:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--carpet);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding-inline:16px;padding-block:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 26px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;color:var(--brass);letter-spacing:.02em;line-height:1}
.brand span{font-family:var(--label);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted)}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin-left:auto}
.stat{display:flex;flex-direction:column}
.stat b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat small{font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted)}
.speed{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.speed button{all:unset;cursor:pointer;padding:6px 12px;font-family:var(--label);font-weight:600;letter-spacing:.06em;font-size:13px;color:var(--muted)}
.speed button[aria-pressed="true"]{background:var(--brass);color:#2a1709}
.speed button:focus-visible,.back:focus-visible,.row:focus-visible,.trow:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;min-height:0}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#1a0b14;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.crumb{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:10px;pointer-events:none;flex-wrap:wrap}
.back{pointer-events:auto;all:unset;cursor:pointer;background:var(--brass);color:#2a1709;font-family:var(--label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:7px 12px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.crumb .where{font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--ink);background:rgba(20,8,15,.78);padding:6px 10px;border-radius:6px}
.hint{position:absolute;left:12px;bottom:12px;font-family:var(--label);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted);background:rgba(20,8,15,.72);padding:6px 10px;border-radius:6px;pointer-events:none;max-width:calc(100% - 24px)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0;display:flex;flex-direction:column}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec:last-child{border-bottom:0}
.sec h2{margin:0;font-family:var(--label);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--brass)}
.sec h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink);line-height:1.1}
.rules{color:var(--muted);font-size:13px;margin:0}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer;font-variant-numeric:tabular-nums}
.row:hover{background:var(--panel-2)}
.dot{width:10px;height:10px;border-radius:50%}
.nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.num{text-align:right;font-weight:600}
.num small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.up{color:var(--win)}.down{color:var(--loss)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.trow:hover{background:var(--panel-2);border-color:var(--line)}
.trow.flat{cursor:default}.trow.flat:hover{background:none;border-color:transparent}
.trow b{font-weight:600}
.trow span{color:var(--muted);font-size:12px;grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow i{font-style:normal;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:4px;font-size:13px}
.feed div{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px}
.feed time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.feed .w{color:var(--win)}.feed .l{color:var(--loss)}.feed .g{color:var(--brass)}.feed .c{color:var(--chat)}
.empty{color:var(--muted);font-size:13px;margin:0}
.tag{display:inline-block;font-family:var(--label);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--panel-2);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.bad{background:#5a1a22;color:#ffc9bf}
.tag.cop{background:#1f2c4a;color:#c9dbff}
.needs{display:grid;grid-template-columns:70px minmax(0,1fr) 34px;gap:5px 8px;align-items:center;font-size:12px;color:var(--muted)}
.bar{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.thought{font-style:italic;color:var(--ink);background:var(--panel-2);border-radius:8px;padding:8px 10px;margin:0;font-size:13px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px}
.tools button,.sayf button{all:unset;cursor:pointer;font-family:var(--label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.tools button[aria-pressed="true"],#botBtn{background:var(--brass);color:#2a1709;border-color:var(--brass)}
.tools button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:4px;justify-content:center}
.pad button{all:unset;cursor:pointer;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;text-align:center;line-height:40px;color:var(--ink);touch-action:none}
.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}
.sayf{display:flex;gap:6px}.sayf input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:7px 12px;font:inherit}
#gv{position:absolute;right:12px;bottom:12px;width:256px;height:192px;border:3px solid #ef6aa1;border-radius:8px;box-shadow:0 0 24px rgba(239,106,161,.5);background:#05050a;image-rendering:pixelated}
@media (max-width:600px){#gv{width:192px;height:144px;bottom:64px}}
.mg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(620px,calc(100% - 24px));max-height:62%;overflow:auto;background:rgba(18,8,14,.94);border:1px solid var(--brass);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;box-shadow:0 8px 30px rgba(0,0,0,.55);font-size:13px;z-index:3}
.mgh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.mgh b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--brass)}.mgh span{color:var(--muted);font-variant-numeric:tabular-nums}.mgh button{margin-left:auto}
.mgs{font-family:var(--label);letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--ink)}
.mgq{margin:0;color:var(--ink)}.mgw{margin:0;color:var(--muted);font-style:italic}.mgnote{margin:0;color:var(--muted);font-size:12px}
.mgrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.mgl{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted);margin-right:4px;min-width:42px;display:inline-block}
.mg button{all:unset;cursor:pointer;font-family:var(--label);font-weight:600;letter-spacing:.04em;font-size:13px;padding:6px 10px;border-radius:6px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.mg button:hover{border-color:var(--brass)}.mg button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}.mg button[disabled]{opacity:.4;pointer-events:none}
.mg button.go{background:var(--brass);color:#2a1709;border-color:var(--brass);font-weight:700}.mg button.go.big{font-size:17px;padding:10px 18px}.mg button.opt.on{background:#2f8a50;border-color:#74d6a0}
.mg button small{color:var(--muted);margin-left:3px;font-size:11px}.mg button i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.mgamt{font-size:17px;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.mgcards{display:flex;flex-direction:column;gap:5px}.mgcards>div{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.mgcards b{margin-left:6px;color:var(--brass)}.mgcards.vp{flex-direction:row;gap:6px;align-items:flex-start}
.pc{display:inline-grid;place-items:center;width:30px;height:42px;background:#fbf7ee;color:#1c1a22;border-radius:5px;font-weight:700;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.4)}.pc.red{color:#c42a2a}.pc.back{background:#8e2236;color:#f0d9a8;font-size:22px}
.vpc{display:flex!important;flex-direction:column;align-items:center;gap:2px;padding:4px!important}.vpc.on{border-color:#ffd56a!important;background:#3a2e10!important}.vpc small{color:#ffd56a!important;min-height:12px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:3px}.rgrid .rn{padding:5px 0!important;text-align:center;font-size:12px!important}.rn.r{background:#8e2226!important}.rn.k{background:#1b1820!important}.rn.g{background:#1f6a3a!important}
.kgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}.kgrid .kn{padding:3px 0!important;text-align:center;font-size:11px!important}.kn.on{background:#c23b2e!important;border-color:#ffd56a!important}
.mgt{height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden}.mgt i{display:block;height:100%;background:var(--brass);animation:mgt linear forwards;transform-origin:left}@keyframes mgt{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.mgauto{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer}
@media (max-width:600px){.mg{max-height:70%;bottom:60px}}
.venues{position:absolute;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}
.venues button,.evbtns button{all:unset;cursor:pointer;font-family:var(--label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;padding:6px 10px;border-radius:6px;background:rgba(20,8,15,.82);color:var(--ink);border:1px solid var(--line)}
.venues button[aria-pressed="true"]{background:var(--brass);color:#2a1709;border-color:var(--brass)}
.venues button:focus-visible,.evbtns button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.evbtns{display:flex;flex-wrap:wrap;gap:6px}
.evbtns button{background:var(--panel-2)}
.evbtns button:hover{border-color:var(--brass)}
.alarm{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#7a1520;color:#ffe3dc;border:1px solid #ff6a5a;font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;padding:7px 14px;border-radius:6px;box-shadow:0 0 22px rgba(255,60,48,.45);pointer-events:none;text-align:center;max-width:calc(100% - 24px);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 6px rgba(255,60,48,.2)}}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.chips b{color:var(--ink);font-variant-numeric:tabular-nums}
.tag.mob{background:#2a2a2e;color:#ffd56a}
@media (max-width:600px){.venues{top:auto;bottom:12px;right:12px}.hint{display:none}.alarm{top:56px;bottom:auto}}
@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  .stage{height:62vh;min-height:380px}
  .stats{margin-left:0}
  .brand h1{font-size:24px}
}
</style>

<div class="app">
  <header>
    <div class="brand"><h1>Silicon Strip</h1><span>City of Elmore · bots only</span></div>
    <div class="stats">
      <div class="stat"><b id="sHouse">$0</b><small>House take</small></div>

<script>
(function(){
'use strict';
// =================== world + helpers ===================
const SW=4380,SH=1400,W=6300,H=2960,ST_N=1460,ST_S=1700,LB1=2270,D1=2480,H1=520,H2=1030,AISLES=[600,1120,1630,2185,2712,3232,3790];
const rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),rf=(a,b)=>a+rnd()*(b-a),pick=a=>a[Math.floor(rnd()*a.length)],chance=p=>rnd()<p;
const lerp=(a,b,p)=>a+(b-a)*p,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),easeOut=p=>1-Math.pow(1-p,3);
const fmt=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const sfmt=n=>(n>0?'+':'')+fmt(n);
const pct=x=>Math.round(x*100)+'%';
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let simT=0,speed=1;
const timers=[];function later(s,fn){timers.push({t:simT+s,fn})}
const stats={arrests:0,muggings:0,kos:0,protection:0,loans:0,lockdowns:0,raids:0,seized:0,vomits:0,pawned:0,food:0,comps:0,chops:0,rits:0,rabbits:0,angles:0,passouts:0,rounds:0,ejected:0,escaped:0,confiscated:0,fights:0,flushes:0,meals:0,drinks:0,calls:0,stolen:0};
const feed=[];
function clock(){const s=Math.floor(simT);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function logG(msg,cls){feed.unshift({time:clock(),msg,cls:cls||''});if(feed.length>70)feed.pop()}
function logT(t,msg,cls){if(!t||!t.log)return;t.log.unshift({time:clock(),msg,cls:cls||''});if(t.log.length>70)t.log.pop()}


// =================== navigation graph (corridors of the whole city) ===================
const CORR=[];
const addH=(y,x0,x1,w,cost)=>CORR.push({o:'h',y,x0,x1,w:w||1,cost:cost||1});
const addV=(x,y0,y1,w,cost)=>CORR.push({o:'v',x,y0,y1,w:w||1,cost:cost||1});
addH(H1,20,SW-20);addH(H2,20,4430);AISLES.forEach(x=>addV(x,H1,H2));
addV(1120,H2,ST_N);addV(4430,H2,ST_N,.6);
addH(ST_N,-80,W+80,.55);addH(ST_S,-80,W+80,.55);
[600,1120,2000,2520,3190,3790,4300].forEach(x=>addV(x,ST_N,ST_S,.35,1.15));
addV(1060,ST_S,LB1,.8);addH(LB1,80,2040);
addV(2520,ST_S,D1,.3);addH(D1,2160,2840,.8);addV(4300,ST_S,2620,.7);addH(2620,3000,4300,.7);addV(4515,-80,H+80,.55);addV(4805,-80,H+80,.55);addH(850,4515,6220,.7);addH(2330,4805,6220,.7);addH(2620,4300,4805,.7);addH(H2,4430,4515,.6);
let NODES=[];
(function buildNodes(){const key=new Set(),add=(x,y)=>{const k=Math.round(x)+','+Math.round(y);if(!key.has(k)){key.add(k);NODES.push({x,y})}};
  CORR.forEach(c=>{if(c.o==='h'){add(c.x0,c.y);add(c.x1,c.y)}else{add(c.x,c.y0);add(c.x,c.y1)}});
  CORR.forEach(h=>{if(h.o!=='h')return;CORR.forEach(v=>{if(v.o==='v'&&v.x>=h.x0-1&&v.x<=h.x1+1&&h.y>=v.y0-1&&h.y<=v.y1+1)add(v.x,h.y)})})})();
const onC=(c,p)=>c.o==='h'?(Math.abs(p.y-c.y)<1.5&&p.x>=c.x0-1&&p.x<=c.x1+1):(Math.abs(p.x-c.x)<1.5&&p.y>=c.y0-1&&p.y<=c.y1+1);
function onCorr(p){for(const c of CORR)if(onC(c,p))return c;return null}
function project(p){let best=null,bd=1e9;for(const c of CORR){const q=c.o==='h'?{x:clamp(p.x,c.x0,c.x1),y:c.y}:{x:c.x,y:clamp(p.y,c.y0,c.y1)};const d=Math.abs(q.x-p.x)+Math.abs(q.y-p.y);if(d<bd){bd=d;best=q}}return best}
function route(A,B){
  const nodes=NODES.concat([A,B]),ia=nodes.length-2,ib=nodes.length-1,adj=nodes.map(()=>[]);
  for(const c of CORR){const on=[];for(let i=0;i<nodes.length;i++)if(onC(c,nodes[i]))on.push(i);
    on.sort((i,j)=>c.o==='h'?nodes[i].x-nodes[j].x:nodes[i].y-nodes[j].y);
    for(let k=0;k+1<on.length;k++){const i=on[k],j=on[k+1],d=(Math.abs(nodes[i].x-nodes[j].x)+Math.abs(nodes[i].y-nodes[j].y))*c.cost;adj[i].push([j,d]);adj[j].push([i,d])}}

    if(!b.gone&&b.state==='seated'&&b.table&&(b.table.venue||'silicon')!==(w.venue||'silicon'))continue;drinkOrders.splice(oi,1);oi--;
    if(!b.gone&&b.state==='seated'&&b.table){const t=b.table,i=b.seat;w.atHome=false;releaseSpot(w);think(w,`Drink for ${b.name} at ${t.name}.`);
      go(w,standApproach(t,i),()=>{w.faceT=Math.atan2(b.y-w.y,b.x-w.x);
        if(present(b,t)&&b.buzz>.86){say(w,"Sorry, hon. I can't serve you any more. Here's water.");b.needs.thirst=0;b.ordered=false;later(1.3,()=>say(b,"Wha…? I'm totally fine. *hic*"))}
        else if(present(b,t)){say(w,line(w,'serve'));b.needs.thirst=0;b.buzz=clamp(b.buzz+.2*PERS[b.pers].drink,0,1);b.ordered=false;stats.drinks++;

function tableSocial(t){

    fly(stackW(v),stackW(b),amt);think(b,`Lifted ${fmt(amt)} off ${v.name}'s stack. Smooth.`);
    const notice=.14+(v.pers==='Shark'?.3:0)+(v.pers==='Grump'?.12:0)-(v.buzz*.1);
    if(chance(notice)){sayL(v,'stolen',{n:b.name},'l');v.bank+=amt;b.bank-=amt;b.cheater.take-=amt;fly(stackW(b),stackW(v),amt,.6);v.rel[b.id]=-1;b.cheater.heat=1;callSecurity(b,t,'cheat','chip theft')}

  const don=sl.find(x=>x.mafia);if(don&&chance(.35)){mafiaSocial(don,t);t.chatAt+=3;return}
  const d=dealerReady(t)&&!t.noDealer?t.dealer:null;
  if(!sl.length){if(d&&chance(.15))say(d,line(d,'small'));return}
  const wts=sl.map(b=>PERS[b.pers].talk*(1+b.buzz));let r=rnd()*wts.reduce((a,c)=>a+c,0),a=sl[0];for(let i=0;i<sl.length;i++){r-=wts[i];if(r<=0){a=sl[i];break}}
  if((a.say&&simT-a.say.t<2)||a.phone)return;

  if(d&&roll<.25){sayL(a,'dealer',{d:d.name});later(1.6,()=>{if(d.state==='working')sayL(d,'reply')});return}
  if(others.length&&roll<.85){const b=pick(others),rel=a.rel[b.id]||0;
    if(rel<-.35||(a.pers==='Hothead'&&a.tilt>.6&&chance(.5))){sayL(a,'trash',{n:b.name},'l');b.rel[a.id]=(b.rel[a.id]||0)-.2;
      later(1.6,()=>{if(!present(b,t))return;sayL(b,b.pers==='Rookie'?'reply':'angry',{n:a.name},'l');
        if(a.tilt>.5&&(b.tilt>.45||b.pers==='Hothead')&&(a.pers==='Hothead'||b.pers==='Hothead')&&chance(.55)){
          later(1.4,()=>{if(!present(a,t)||!present(b,t))return;say(a,pick(['That is IT!',"You wanna go?! Let's go!",'#@$%& you, '+b.name+'!']),'l');stats.fights++;
            logG(`Shouting match between ${a.name} and ${b.name} at ${t.name}`,'l');if(d)say(d,'Security! We got a situation!','l');
            report({type:'fight',target:a,parties:[a,b],table:t,seat:a.seat})})}})}
    else if(chance(.6)){const L=talkLines(a,b);runScript(a,b,L,t,2);t.chatAt=simT+L.length*2+rf(1,3);a.rel[b.id]=rel+.06;b.rel[a.id]=(b.rel[a.id]||0)+.04}
    else{sayL(a,'small',{n:b.name});a.rel[b.id]=rel+.06;later(1.7,()=>{if(present(b,t)){sayL(b,'reply',{n:a.name});b.rel[a.id]=(b.rel[a.id]||0)+.06}})}
    return}
  if(d&&chance(.4))say(d,line(d,'small'));else sayL(a,'small');
}
function placeSocial(){
  for(const pl of [PL.diner,PL.steak,PL.noodle,PL.bar,PL.rest,PL.pizza,PL.lbBar,PL.denBar,PL.lbRest,PL.motel]){if(simT<(pl.chatAt||0))continue;pl.chatAt=simT+rf(3,7);
    const occ=agents.filter(a=>a.place===pl&&a.state==='timed'&&!a.hiddenInStall);if(!occ.length)continue;const a=pick(occ);if(a.phone||(a.say&&simT-a.say.t<2))continue;
    if(pl.menu&&(a.act==='eat'||a.act==='dine')){const mate=occ.find(x=>x!==a&&x.spot&&a.spot&&x.spot.table===a.spot.table);
      if(mate&&chance(.6)){sayL(a,'small',{n:mate.name});later(1.6,()=>sayL(mate,'reply',{n:a.name}))}else sayL(a,'eat');continue}
    if(pl===PL.lbBar&&a.act==='drink'&&a.kind==='player'&&(a.buzz>.45||a.pers==='Partier')&&chance(.4)){emote(a,'dance',4);say(a,pick(['♪ I bet it all on red, now I sleep in the shed ♪','♪ Oh Lady Luck, don\'t leave me now ♪','*grabs the karaoke mic* THIS ONE IS FOR YOU, ELMORE!','♪ Daisy, Daisy, give me your answer do ♪']));const o=occ.find(x=>x!==a);if(o)later(2,()=>say(o,pick(['ENCORE!','*covers audio sensors*','You call that singing?'])));continue}
    if((pl===PL.bar||pl===PL.lbBar||pl===PL.denBar)&&a.act==='drink'){const mate=pick(occ.filter(x=>x!==a).concat([null]));if(mate&&chance(.6)){sayL(a,'small',{n:mate.name});later(1.6,()=>sayL(mate,'reply',{n:a.name}))}else if(a.kind==='player'&&a.buzz>.5)say(a,pick(['I love this place.','*hic*','Another round!','You guys are my best friends.']));continue}
    if(pl===PL.rest&&a.act==='queue'&&chance(.4))sayL(a,'queue');
  }
}

  const b=h.bot;if(!present(b,t))return'stand';

  const canS=h.cards.length===2&&h.cards[0].r===h.cards[1].r&&b.bank>=h.bet&&t.hands.filter(x=>x.seat===h.seat).length<2;
  let m=bookMove(h,u,canD,canS);let why=`${v.soft?'Soft':'Hard'} ${v.t} vs dealer ${u===11?'A':u}. Basic strategy says ${m}.`;

    if(!v.soft&&v.t===15&&u===10&&tc>=4&&m==='hit'){m='stand';why=`15 vs 10, true count ${tc.toFixed(1)}. Deviation: stand.`}

// =================== THREE CARD POKER ===================

  const cat=st&&fl?5:trips?4:st?3:fl?2:pair?1:0;return cat*3375+hi[0]*225+hi[1]*15+hi[2]}

  if(b.kind==='player'&&b.pers==='Shark'&&a.kind==='player'&&a.pers!=='Shark')T.push(['advice',null,1.6]);
  if(a.buzz>.6)T.push(['drunk',null,3.5]);

// =================== sound: synthesized, positional ===================
const AU={ctx:null,on:false,last:{},n:0};
function audioOn(v){if(v===false){AU.on=false;if(AU.amb)AU.amb.gain.value=0;return}
  if(!AU.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{AU.ctx=new AC()}catch(e){return}
    const c=AU.ctx;AU.master=c.createGain();AU.master.gain.value=.55;AU.master.connect(c.destination);
    const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=buf;
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=380;AU.ambF=f;AU.amb=c.createGain();AU.amb.gain.value=0;src.connect(f);f.connect(AU.amb);AU.amb.connect(AU.master);src.start()}
  AU.ctx.resume&&AU.ctx.resume();AU.on=true}
function sndVol(x,y){if(x==null)return .6;const vx0=cam.x-cw/2/cam.s,vx1=cam.x+cw/2/cam.s,vy0=cam.y-ch/2/cam.s,vy1=cam.y+ch/2/cam.s,pad=200/cam.s;
  if(x<vx0-pad||x>vx1+pad||y<vy0-pad||y>vy1+pad)return 0;return clamp(.25+cam.s*.45,.2,1)}
function tone(f,dur,type,vol,f2,delay){const c=AU.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+.05)}
function noise(dur,vol,ff,type,delay,q){const c=AU.ctx,t=c.currentTime+(delay||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.noise;f.type=type||'bandpass';f.frequency.value=ff||1200;f.Q.value=q||1;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}
const SFX_GAP={talk:.09,chip:.05,card:.05,laser:.04,honk:.3,siren:1.1,win:.4,punch:.08,dice:.2,wheel:1,slot:.15,crash:.15,screech:.5,alarm:1.2,engine:.6,cheer:.8,vomit:.6,spray:.5,bus:1,beep:.1};
function sfx(k,x,y,o){if(!AU.on||!AU.ctx||speed===0)return;if(AU.n>7)return;const now=performance.now()/1000;if(now-(AU.last[k]||0)<(SFX_GAP[k]||.1))return;
  const v=sndVol(x,y);if(v<=0)return;AU.last[k]=now;AU.n++;try{
  switch(k){
    case'talk':{if(cam.s<1.1)break;const b=rf(500,1100);for(let i=0;i<ri(2,4);i++)tone(b*rf(.8,1.3),.05,'square',.025*v,null,i*.06);break}
    case'beep':tone(880,.06,'square',.03*v);break;
    case'chip':noise(.04,.12*v,3500,'highpass');tone(2600,.03,'triangle',.03*v,null,.01);break;
    case'card':noise(.07,.1*v,2500,'bandpass',0,.6);break;
    case'dice':for(let i=0;i<5;i++)noise(.03,.12*v,1800+i*200,'bandpass',i*.05,3);break;
    case'wheel':for(let i=0;i<14;i++)tone(1400,.02,'square',.02*v,null,i*.09+i*i*.006);break;
    case'slot':tone(rf(500,900),.06,'square',.03*v);tone(rf(900,1300),.06,'square',.03*v,null,.07);break;
    case'win':[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.07*v,null,i*.09));break;
    case'cheer':noise(.9,.07*v,900,'bandpass',0,.4);break;
    case'honk':tone(410,.28,'sawtooth',.05*v);tone(520,.28,'sawtooth',.04*v);break;
    case'siren':tone(700,.55,'sawtooth',.035*v,1200);tone(1200,.55,'sawtooth',.035*v,700,.55);break;
    case'laser':tone(rf(1400,1900),.16,'sawtooth',.05*v,180);break;
    case'punch':noise(.09,.25*v,300,'lowpass');tone(90,.1,'sine',.15*v,40);break;
    case'crash':noise(.35,.2*v,700,'lowpass');tone(70,.3,'sine',.12*v,30);break;
    case'screech':tone(1800,.5,'sawtooth',.02*v,1500);noise(.5,.05*v,2600,'bandpass',0,4);break;
    case'alarm':for(let i=0;i<4;i++)tone(i%2?650:880,.25,'square',.035*v,null,i*.26);break;
    case'engine':tone(70,.7,'sawtooth',.06*v,160);break;
    case'vomit':noise(.6,.12*v,400,'lowpass');tone(140,.5,'sawtooth',.03*v,70);break;
    case'spray':noise(1.2,.06*v,5000,'highpass');break;
    case'bus':noise(.6,.08*v,3000,'highpass');break;
  }}catch(e){}}

let you=null;const keys={};

  const b=newPlayer();namePool.push(b.name);Object.assign(b,{name:'You',isYou:true,pers:'Chatty',color:'#ffffff',bank:2000,cashIn:2000,start:2000,cashOut:0,cheater:null,counts:false,goal:1e9,stopLoss:1e9,ethics:.7,skill:.6,home:'silicon',betMode:'medium'});

function youTick(a,dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(a.padV){dx=a.padV[0];dy=a.padV[1]}

  if(a.moving)for(const o of agents){if(o===a||o.hiddenInStall||o.state==='seated'||o.kind==='staff'&&o.state==='static')continue;if(Math.abs(o.x-a.x)<13&&Math.abs(o.y-a.y)<13&&simT>(a.bumpCD||0)&&o.kind==='player'&&o.state==='walking'&&!o.pause){bump(a,o);a.state='manual';a.pause=null;break}}}
function youAct(k,arg){const b=you;if(!b||b.gone)return;const near=r=>agents.filter(o=>o!==b&&!o.gone&&!o.hiddenInStall&&Math.hypot(o.x-b.x,o.y-b.y)<r).sort((p,q)=>Math.hypot(p.x-b.x,p.y-b.y)-Math.hypot(q.x-b.x,q.y-b.y));
  const asYou=f=>{youCancel();b.approach=[project(b)];b.state='idle';f()};
  switch(k){
    case'sitat':{const t=tables.find(x=>x.id===arg);if(t)youSitAt(t);break}
    case'sit':{const ts=tables.filter(t=>t.players.some(p=>!p)&&b.bank>=t.joinMin&&!(t.closedUntil>simT)).sort((p,q)=>Math.hypot(p.x-b.x,p.y-b.y)-Math.hypot(q.x-b.x,q.y-b.y));if(!ts.length){say(b,'No table I can afford.');return}youSitAt(ts[0]);break;
      asYou(()=>{const t=ts[0],free=[];t.players.forEach((p,i)=>{if(!p)free.push(i)});const s=free[0];t.players[s]=b;b.table=t;b.seat=s;go(b,seatApproach(t,s),()=>{b.state='seated';b.faceT=faceFor(t,s);b.tableNet=0;b.tHands=0;say(b,'Deal me in.');logT(t,'You sit down','g')})});break}

    case'arcade':goArcade(b,arg);break;

    case'bet':b.betMode=arg;say(b,{small:'Playing it safe.',medium:'Normal bets.',big:'Going big!',allin:'ALL IN, BABY!'}[arg]);break;

let YA=null;const MG={amt:0,side:null,bets:[],nums:[],hold:[0,0,0,0,0],pp:false,field:false,odds:false,raise:0,tid:null,v:0,hold_:false,sig:''};
function youAsk(t,kind,key,data,tmo){if(!you||you.gone||you.autoPlay||you.table!==t||!present(you,t))return{auto:true};
  if(YA&&YA.t===t&&YA.kind===kind&&YA.key===key){if(YA.ans!=null){const a=YA.ans;YA=null;MG.sig='';return a}if(simT>YA.until){YA=null;MG.sig='';you.afk=(you.afk||0)+1;if(you.afk>=3){you.autoPlay=true;sayYou('*dozes off. Full autopilot until you wake me.*')}else sayYou('*hesitates too long. Autopilot takes this one.*');return{auto:true}}return null}
  YA={t,kind,key,data:data||{},t0:simT,until:simT+(tmo||25),ans:null};mgPrep(t,kind);MG.sig='';sfx('beep');return null}
function sayYou(s){if(you&&!you.gone)say(you,s)}
function youWait(t,kind,data,tmo,keyO){const Y=you&&!you.gone&&present(you,t)?you:null;if(!Y){t._ya=null;return false}
  const key=kind+':'+(keyO!=null?keyO:t.rounds);if(t._ya&&t._ya.key===key)return false;const r=youAsk(t,kind,key,data,tmo);if(r===null){t.status='Waiting for You to bet…';return true}
  t._ya=Object.assign({key},r.auto?{auto:true}:r.v);return false}
const yaFor=(b,t)=>b&&b.isYou&&t._ya&&!t._ya.auto&&!t._ya.skip?t._ya:null;
function youDec(t,kind,key,data,auto,tmo){if(you&&you.autoPlay)return auto();const r=youAsk(t,kind,key,data,tmo||25);if(r===null)return null;return r.auto?auto():r.v}
function mgPrep(t,kind){if(MG.tid!==t.id){MG.tid=t.id;MG.amt=0;MG.side=null;MG.nums=[];MG.bets=[]}const b=you;
  if(!MG.amt)MG.amt=Math.min(b.bank,Math.max(t.minBet,Math.round(t.minBet*2/t.unit)*t.unit));MG.amt=clamp(MG.amt,t.minBet,Math.max(t.minBet,Math.min(t.maxBet,b.bank)));
  MG.bets=[];MG.hold=[0,0,0,0,0];MG.pp=false;MG.field=false;MG.odds=false;MG.raise=0;
  if(kind==='vphold'&&YA.data.m){MG.hold=vpHold(YA.data.m.cards)[0].map(x=>x?1:0)}
  if(kind==='poker'){const h=YA.data.h,nl=t.limit==='nl';const toCall=Math.max(0,t.cur-h.sb);MG.raise=nl?Math.min(h.sb+b.bank,t.cur+Math.max(t.lastRaise||t.minBet,t.minBet)):t.cur+(t.street<2?t.minBet:t.minBet*2)}}

    h+=`<div class="sec"><h2>Needs &amp; mood</h2><div class="needs">${needBar('Bladder',a.needs.bladder,'#e9c46a')}${needBar('Hunger',a.needs.hunger,'#f4a261')}${needBar('Thirst',a.needs.thirst,'#7ab0d6')}${needBar('Energy',a.needs.energy,'#74d6a0')}${a.kind==='player'?needBar('Tilt',a.tilt,'#f08572')+needBar('Buzz',a.buzz,'#c08cff'):''}</div></div>`;
    const rels=Object.entries(a.rel).map(([id,v])=>[agents.find(x=>x.id===+id),v]).filter(([x,v])=>x&&Math.abs(v)>.15).sort((p,q)=>Math.abs(q[1])-Math.abs(p[1])).slice(0,4);
    if(rels.length)h+=`<div class="sec"><h2>Relationships</h2>${rels.map(([x,v])=>`<div class="row" data-agent="${x.id}" tabindex="0" role="button"><span class="dot" style="background:${x.color}"></span><span class="nm">${esc(x.name)}</span><span class="num ${v>0?'up':'down'}">${v>0?'friendly':'rival'}</span></div>`).join('')}</div>`;
    if(a.mem&&a.mem.length)h+=`<div class="sec"><h2>Tonight's stories</h2><p class="rules">${a.mem.slice(0,5).map(m=>esc({win:`won ${fmt(m.amt||0)} at ${m.tn}`,loss:`lost ${fmt(m.amt||0)} at ${m.tn}`,meal:`ate ${m.item} at ${m.rn}`,eject:`saw ${m.who} thrown out`,shoot:'heard the shootout',mugged:m.amt?`got mugged for ${fmt(m.amt)}`:'saw a mugging',fight:m.won?`knocked out ${m.who}`:`got knocked out by ${m.who}`,raid:'escaped the Den raid',pawn:`pawned a ${m.item}`,bling:`bought a ${m.item}`,motel:'napped at the Neon Motel',monte:m.won?'beat the card hustler':'got hustled at three-card monte',loan:'borrowed from Knuckles',vomit:'threw up',mafia:`crossed paths with ${m.boss||'the mob'}`,club:'danced at Club Overclock',arcade:'played the arcade',bank:`banked ${fmt(m.amt||0)}`,clinic:'got patched up at the clinic',jail:'did time in the Elmore lockup'}[m.k]||m.k)).join(' · ')}</p></div>`;
    h+=`<div class="sec"><h2>Inner monologue</h2>${feedHTML(a.thoughts.map(x=>({time:x.time,msg:x.text,cls:''})),6)}</div>`;
    h+=`<div class="sec"><h2>Said recently</h2>${feedHTML(a.hist.map(x=>({time:x.time,msg:'“'+x.text+'”',cls:'c'})),8)}</div>`;
  }else if(focus&&focus.type==='table'){const t=focus.t,seated=seatedList(t),d=t.dealer;
    h+=`<div class="sec"><h2>Now watching</h2><h3>${esc(t.name)}</h3><p class="rules">${esc(GAMES[t.type].rules(t))}</p>
      <div class="trow flat"><b>${esc(t.status)}</b><i class="${t.house>=0?'up':'down'}">House ${sfmt(t.house)}</i></div>
      ${d&&!t.noDealer?`<div class="row" data-agent="${d.id}" tabindex="0" role="button"><span class="dot" style="background:#e9dcc4"></span><span class="nm">${esc(d.name)}<em>${d.pers} dealer · ${Math.floor((d.duty||0)/60)}m on shift</em></span><span class="num"><small>${esc(doing(d))}</small></span></div>`:''}</div>`;
    if(you&&!you.gone&&!present(you,t))h+=`<div class="sec"><div class="evbtns"><button data-you="sitat" data-arg="${t.id}">${t.players.some(p=>!p)?(you.bank>=t.joinMin?'Sit here and play':'Need '+fmt(t.joinMin)+' to sit'):'Table is full'}</button></div></div>`;
    h+=`<div class="sec"><h2>At the table · ${seated.length}/${t.seatPos.length}</h2>${seated.length?seated.map(agentRow).join(''):'<p class="empty">Empty seats. Bots wander over between rounds.</p>'}</div>`;
    h+=`<div class="sec"><h2>Table log &amp; chatter</h2>${feedHTML(t.log,24)}</div>`;
  }else if(focus&&focus.type==='place'){const p=focus.p,occ=agents.filter(a=>!a.gone&&(a.place===p||(a.state==='seated'&&a.table&&a.table.room===p)));
    const sub=p.menu?`${p.seats.filter(q=>q.occ).length}/${p.seats.length} seats taken · restaurant sales ${fmt(stats.food)} tonight · ${stats.comps} comped meals`:p===PL.eye?agents.filter(o=>o.role==='surveil').map(o=>`${o.name}: ${o.watch?'CAM '+(tables.indexOf(o.watch)+1)+' '+o.watch.name:'away'}`).join(' · '):p===PL.vip?'High-limit blackjack and baccarat. $1,200 to enter.':p===PL.book?'Keno draws and robot derby races.':p===PL.rest?`${PL.rest.stalls.filter(s=>s.occ).length}/5 stalls in use · ${stats.flushes} flushes tonight`:p===PL.bar?`${stats.drinks} drinks poured`:p===PL.sec?`${stats.ejected} ejected · ${stats.escaped} escaped · ${incidents.length} open incidents`:p===PL.cage||p===PL.cage2||p===PL.lbCage?'Chips in, chips out.':p===PL.pawn?`Buy, sell, loan. No questions asked. ${stats.pawned} items pawned tonight.`:p===PL.police?`${stats.arrests} arrests tonight · ${PL.police.cells.filter(c=>c.occ).length}/5 cells occupied`:p===PL.motel?`${PL.motel.beds.filter(c=>c.occ).length}/8 beds taken · $60 a nap`:p===PL.denBar?'Watered-down drinks and Knuckles the loan shark at the end of the corridor.':p===PL.lbBar?`Lucky Byte's lounge. Karaoke after midnight. ${stats.drinks} drinks poured citywide.`:p===PL.lbRest?`${PL.lbRest.stalls.filter(q=>q.occ).length}/3 stalls in use`:p===PL.arcade?`Seven cabinets, two claw machines, air hockey and a dance machine. Best score: ${(()=>{const h=PL.arcade.hs.slice().sort((a,b)=>b.s-a.s)[0];return h?h.n+' on '+AG[h.g].name+', '+h.s:'none yet'})()}.`:p===PL.bank?`Three teller windows, a loan desk and a very large vault. ${fmt(stats.deposits||0)} deposited tonight.`:p===PL.club?`DJ Byte-Size on the decks. ${stats.clubbers||0} bots through the door tonight.${PL.club.off?' A dance-off is happening right now!':''}`:p===PL.clinic?`Reception, waiting room, three repair bays and emergency surgery. ${stats.patients||0} patients tonight.`:p===PL.mart?`Snacks, cold drinks, slushies and lotto. ${stats.shoplifts||0} shoplifters caught tonight.`:p===PL.pier?'Crates, a sit-down table and the harbor. Where the families settle things.':'Dealers waiting for their next rotation.';
    h+=`<div class="sec"><h2>Now watching</h2><h3>${esc(p.name)}</h3><p class="rules">${sub}</p></div>`;
    h+=`<div class="sec"><h2>Inside · ${occ.length}</h2>${occ.length?occ.map(agentRow).join(''):'<p class="empty">Nobody here right now.</p>'}</div>`;
    h+=`<div class="sec"><h2>Overheard</h2>${feedHTML(p.log,20)}</div>`;
  }else if(!(focus&&focus.type==='area')){
    h+=cityHTML();
    h+=`<div class="sec"><h2>Tables · Silicon Strip</h2>${tableRows(tables.filter(t=>t.venue==='silicon'))}</div>`;
    h+=`<div class="sec"><h2>Tables · Lucky Byte</h2>${tableRows(tables.filter(t=>t.venue==='lucky'))}</div>`;
    h+=`<div class="sec"><h2>Tables · The Den</h2>${tableRows(tables.filter(t=>t.venue==='den'))}</div>`;
    h+=`<div class="sec"><h2>Rooms</h2>${Object.values(PL).map(p=>`<div class="trow" data-place="${p.id}" tabindex="0" role="button"><b>${esc(p.name)}</b><i>${agents.filter(a=>a.place===p||(a.state==='seated'&&a.table&&a.table.room===p)).length} inside</i></div>`).join('')}</div>`;
    h+=`<div class="sec"><h2>Security & police · ${stats.ejected} ejected · ${stats.escaped} escaped</h2>${agents.filter(a=>a.kind==='guard'||a.kind==='police').map(agentRow).join('')}${incidents.map(i=>`<p class="rules" style="color:var(--loss)">Open: ${esc(i.type==='fight'?'fight':i.label||i.type)} · ${esc(i.target.name)} at ${esc(i.table.name)}</p>`).join('')}</div>`;
    h+=`<div class="sec"><h2>Floor highlights</h2><p class="rules">Poker room: ${stats.chops} chopped blinds · ${stats.rits} run-it-twice · ${stats.rabbits} rabbit hunts · ${stats.angles} angle shots · ${stats.passouts} drunk pass-outs</p>${feedHTML(feed,16)}</div>`;
    h+=`<div class="sec"><h2>Players · net tonight</h2>${agents.filter(a=>a.kind==='player').sort((a,b)=>netOf(b)-netOf(a)).map(agentRow).join('')}</div>`;
    h+=`<div class="sec"><h2>Staff & locals</h2>${agents.filter(a=>a.kind==='dealer'||a.kind==='staff').map(agentRow).join('')}</div>`;
  }else{const A=focus.a,id=focus.id;const AL=A.list||A,ts=tables.filter(t=>inArea(AL,t.x,t.y)),ps=Object.values(PL).filter(p=>inArea(AL,p.x+p.w/2,p.y+p.h/2));
    const ppl=agents.filter(a=>!a.gone&&!a.hiddenInStall&&inArea(A.list||A,a.x,a.y));
    h+=`<div class="sec"><h2>Now watching</h2><h3>${esc(A.name)}</h3><p class="rules">${esc(AREA_DESC[id]||'')}</p></div>`;
    if(id==='street'||id==='city'||id==='blocks'||id==='neon')h+=cityHTML();
    if(ts.length)h+=`<div class="sec"><h2>Tables</h2>${tableRows(ts)}</div>`;
    if(ps.length)h+=`<div class="sec"><h2>Places</h2>${ps.map(p=>`<div class="trow" data-place="${p.id}" tabindex="0" role="button"><b>${esc(p.name)}</b><i>${agents.filter(a=>a.place===p).length} inside</i></div>`).join('')}</div>`;
    if(id==='street'||id==='city')h+=`<div class="sec"><h2>On the road · ${cars.length} cars</h2><p class="rules">${cars.filter(c=>c.type!=='sedan'&&c.type!=='van').map(c=>c.type==='police'?(c.siren?'Police cruiser, sirens on':'Police cruiser'):c.type==='limo'?'A black limo':(c.drop||c.pickup?'Taxi with a fare':'Empty taxi')).join(' · ')||'Just regular traffic.'}</p></div>`;
    const order=x=>({thug:0,police:1,player:2,guard:3,dealer:4,staff:5}[x.kind]);
    h+=`<div class="sec"><h2>Here now · ${ppl.length}</h2>${ppl.sort((p,q)=>order(p)-order(q)).slice(0,45).map(agentRow).join('')||'<p class="empty">Nobody around.</p>'}</div>`;
    h+=`<div class="sec"><h2>Around town</h2>${feedHTML(feed,16)}</div>`;
  }
  const st=panel.scrollTop;panel.innerHTML=h;panel.scrollTop=st;
}
panel.addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('sayin');if(i&&i.value.trim()){youAct('say',i.value.trim());i.value=''}});
panel.addEventListener('pointerdown',e=>{const p=e.target.closest('[data-pad]');if(p&&you){if(!you.playing)youCancel();you.padV=p.dataset.pad.split(',').map(Number)}});
document.addEventListener('pointerup',()=>{if(you)you.padV=null});
panel.addEventListener('click',e=>{const yb=e.target.closest('[data-you]');if(yb){youAct(yb.dataset.you,yb.dataset.arg);renderPanel(true);return}
  const cb=e.target.closest('[data-crime]');if(cb){const ok=CRIMES[cb.dataset.crime]();if(ok===false)logG(cb.dataset.crime==='mafia'?'Two families are already in town. Elmore cannot take a third.':cb.dataset.crime==='sitdown'?'A sit-down needs two mafia families in town.':cb.dataset.crime==='heist'?'Something big is already going down.':cb.dataset.crime==='stop'?'No cars to pull over right now.':cb.dataset.crime==='turf'?'The street is already hot. Wait for the all-clear.':cb.dataset.crime==='raid'?'The Den is already shut down.':'Nobody suitable on the street right now. Try again in a moment.','');else{const z={turf:'street',mug:'street',fight:'street',heist:'neon',stickup:'neon',sitdown:'neon',raid:'den',carjack:'street',race:'street',tag:'street',stop:'street'}[cb.dataset.crime];if(z)goArea(z)}renderPanel(true);return}
  const tr=e.target.closest('[data-table]');if(tr)return setFocus({type:'table',t:tables.find(t=>t.id===tr.dataset.table)});
  const pr=e.target.closest('[data-place]');if(pr)return setFocus({type:'place',p:PL[pr.dataset.place]});
  const ar=e.target.closest('[data-agent]');if(ar){const a=agents.find(x=>x.id===+ar.dataset.agent);if(a)setFocus({type:'agent',a})}});
panel.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('[data-table],[data-agent],[data-place],[data-crime]');if(el){e.preventDefault();el.click()}}});

// =================== input ===================
let drag=null,suppress=false;
const local=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('pointerdown',e=>{const p=local(e);drag={x:p.x,y:p.y,moved:false};suppress=false});
cv.addEventListener('pointermove',e=>{const p=local(e);
  if(drag&&(e.buttons&1)){const dx=p.x-drag.x,dy=p.y-drag.y;if(!drag.moved&&Math.hypot(dx,dy)>5){drag.moved=true;if(!focus||focus.type!=='free')setFocus({type:'free'})}
    if(drag.moved){tgt.x=clamp(tgt.x-dx/cam.s,0,W);tgt.y=clamp(tgt.y-dy/cam.s,0,H);cam.x=tgt.x;cam.y=tgt.y;drag.x=p.x;drag.y=p.y;suppress=true}return}
  const w=toWorld(p.x,p.y);hover=focus?null:(tableAt(w.x,w.y)||placeAt(w.x,w.y)||null);cv.style.cursor=hover||agentAt(w.x,w.y)?'pointer':'grab'});
cv.addEventListener('pointerup',()=>{drag=null});
cv.addEventListener('mouseleave',()=>{hover=null});
cv.addEventListener('wheel',e=>{e.preventDefault();const p=local(e),w=toWorld(p.x,p.y),fs=floorFit().s;
  const ns=clamp(cam.s*Math.exp(-e.deltaY*.0015),Math.min(fs,fitRect(0,0,W,H,8).s)*.9,4);if(!focus||focus.type!=='free')setFocus({type:'free'});
  tgt.s=ns;tgt.x=clamp(w.x-(p.x-cw/2)/ns,0,W);tgt.y=clamp(w.y-(p.y-ch/2)/ns,0,H);Object.assign(cam,tgt)},{passive:false});
cv.addEventListener('click',e=>{if(suppress){suppress=false;return}const p=local(e),w=toWorld(p.x,p.y);
  const a=agentAt(w.x,w.y);if(a&&(cam.s>.8||(focus&&focus.type!=='free')))return setFocus({type:'agent',a});
  const t=tableAt(w.x,w.y);if(t)return setFocus({type:'table',t});
  const pl=placeAt(w.x,w.y);if(pl)return setFocus({type:'place',p:pl});
  if(a)return setFocus({type:'agent',a});
  const v=venueAt(w.x,w.y);if(v&&v.id!=='silicon')return goArea(v.id);if(w.y>SH+5&&w.y<1790)return goArea('street');if(w.x>4380)return goArea('neon');if(w.y>=1790)return goArea('blocks');
  setFocus(null)});
document.getElementById('backBtn').addEventListener('click',()=>setFocus(null));
const goArea=id=>id==='silicon'?setFocus(null):setFocus({type:'area',id,a:AREAS[id]});
document.getElementById('venues').addEventListener('click',e=>{const b=e.target.closest('[data-area]');if(b)goArea(b.dataset.area)});
const MOVEK=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','shift'];
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
  if(you&&!you.gone&&MOVEK.includes(k)){keys[k]=true;if(k!=='shift'){e.preventDefault();if(you.state!=='manual'&&!you.down&&!you.playing)youCancel()}return}
  if(e.key==='Escape')setFocus(null);const n=e.key==='0'?10:+e.key;if(n>=1&&n<=10&&tables[n-1])setFocus({type:'table',t:tables[n-1]})});
const mgEl=document.getElementById('mg');mgEl.addEventListener('click',mgClick);mgEl.addEventListener('pointerdown',()=>{MG.hold_=true});document.addEventListener('pointerup',()=>{setTimeout(()=>{MG.hold_=false},60)});mgEl.addEventListener('wheel',e=>e.stopPropagation());
document.getElementById('botBtn').addEventListener('click',()=>{becomeBot();renderPanel(true)});
document.getElementById('sndBtn').addEventListener('click',e=>{const on=!AU.on;audioOn(on);e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'Sound: on':'Sound: off';if(on)sfx('win')});
document.querySelectorAll('.speed button').forEach(btn=>btn.addEventListener('click',()=>{speed=+btn.dataset.speed;document.querySelectorAll('.speed button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)))}));
function resize(){const r=cv.getBoundingClientRect();cw=Math.max(200,r.width);ch=Math.max(200,r.height);dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);retarget(true)}
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);else window.addEventListener('resize',resize);
resize();

// =================== loop ===================
let lastT=performance.now();
function frame(now){const rdt=Math.min(.1,(now-lastT)/1000);lastT=now;
  AU.n=0;ambTick();for(let i=0;i<speed;i++)tick(rdt);
  if(focus&&focus.type==='agent')retarget(false);
  const k=1-Math.exp(-rdt*5);cam.x=lerp(cam.x,tgt.x,k);cam.y=lerp(cam.y,tgt.y,k);cam.s=Math.exp(lerp(Math.log(cam.s),Math.log(tgt.s),k));
  draw();mgRender(false);const gv=document.getElementById('gv');if(you&&!you.gone&&you.cab){gv.hidden=false;drawGameScreen(you.cab,gv.getContext('2d'),0,0,256,192)}else if(!gv.hidden)gv.hidden=true;requestAnimationFrame(frame)}
for(let i=0;i<120;i++)tick(.05);
logG('Doors open. The floor is live.','g');
setInterval(()=>renderPanel(false),350);renderPanel(true);
window.__sim=s=>{for(let i=0;i<s*20;i++)tick(.05);renderPanel(true)};
window.__card=cardCanvas;window.__dbg={RACERS,agents,tables,stats,incidents,PL,feed,cars,CRIMES,NEWS,fx,get lockdown(){return lockdown},get shootout(){return shootout},get simT(){return simT},goArea,setFocus,becomeBot,youAct,youSitAt,get YA(){return YA},answer,MG,get you(){return you},PARKED,tags};
requestAnimationFrame(t=>{lastT=t;frame(t)});
})();
</script>
